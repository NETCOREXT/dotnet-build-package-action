name: 'Build Package'
description: 'Build dotnet package'

inputs:
  app:
    description: "App Name"
  dotnet-version:
    description: 'Dotnet Version'
    default: "6.0.x"
  nuget-api-url:
    description: "NuGet URL"
  nuget-api-key:
    description: 'NuGet API key'
  artifact:
    description: "Artifact Name"
  artifact-path:
    description: "Artifact Path"
  branch-production:
    description: "Production Branch"
    default: "main"
outputs:
  app:
    description: "App Name"
    value: ${{ inputs.app }}
  version:
    description: "Version"
    value: ${{ steps.build.outputs.version }}
  artifact:
    description: "Artifact Name"
    value: ${{ steps.upload-artifact.outputs.artifact }}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      if: inputs.artifact != ''
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.artifact-path }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Add NuGet Source
      shell: bash
      if: inputs.nuget-api-url != '' && inputs.nuget-api-key != ''
      run: dotnet nuget add source --username USERNAME --password ${{ inputs.nuget-api-key }} --store-password-in-clear-text --name nuget-${{ github.run_id }} "${{ inputs.nuget-api-url }}"
    - name: Build Package
      id: build
      shell: bash
      run: |
        APP="${{ inputs.app }}"

        COMMIT_SHORT_SHA=`git rev-parse --short ${GITHUB_SHA}`
        COMMIT_COUNT=`git rev-list --count HEAD`
        COMMIT_TIME=`git show -s --format=%ct HEAD`
        ADDITIONAL_ARGUMENTS="-c Debug --version-suffix ${GITHUB_REF_NAME}.${COMMIT_TIME}+${COMMIT_SHORT_SHA}"

        if [ "$GITHUB_REF_NAME" = "${{ inputs.branch-production }}" ]; then
          ADDITIONAL_ARGUMENTS="-c Release"
        fi

        if [ -z "$APP" ]; then
          dotnet pack $ADDITIONAL_ARGUMENTS -o ./packages
        else
          PROJECT_PATH=`find . -type f -iname "${APP}.csproj"`
          dotnet pack $PROJECT_PATH $ADDITIONAL_ARGUMENTS -o ./packages
        fi

        if [ -z "$APP" ]; then
          ASSEMBLY_VERSION=""
        else
          PACKAGE_PATH=`find ./packages -type f -iname "*.nupkg"`

          REGEX="${APP}\.(.*)\.nupkg"

          if [[ "$PACKAGE_PATH" =~ $REGEX ]]; then
            ASSEMBLY_VERSION="${BASH_REMATCH[1]}"
          fi
        fi


        echo "short-sha=$COMMIT_SHORT_SHA" >> $GITHUB_OUTPUT
        echo "version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@v4
      name: Upload packages to artifact
      id: upload-artifact
      with:
        name: packages-${{ steps.build.outputs.short-sha }}
        path: ./packages
    - name: Set Outputs
      shell: bash
      run: echo "artifact=packages-${{ steps.build.outputs.short-sha }}" >> $GITHUB_OUTPUT
